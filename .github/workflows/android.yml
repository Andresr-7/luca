name: Android (Capacitor)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nativo/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Instalar y sincronizar
        working-directory: nativo
        run: npm install --no-audit --no-fund && npx cap sync android
      - name: Compilar paquete sin firmar
        working-directory: nativo/android
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease
      - name: Publicar paquete sin firmar en la rama build-android
        run: |
          mkdir out && cp nativo/android/app/build/outputs/bundle/release/*.aab out/luca-sin-firmar.aab
          cd out && git init -q && git checkout -q -b build-android && git add . && git -c user.name=ci -c user.email=ci@luca commit -qm "build $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-android
      - uses: actions/upload-artifact@v4
        with:
          name: luca-android-sin-firmar
          path: nativo/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
